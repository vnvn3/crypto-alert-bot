name: Crypto Price Checker

on:
  schedule:
    # اجرای هر 15 دقیقه یکبار (ساعت گیت‌هاب UTC است، اما چون در کد پایتون ساعت تهران چک می‌شود، مشکلی نیست)
    - cron: '*/15 * * * *'

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/checkout@v3 # این خط اشتباهی در کپی پیست پیش میاد، حتما پاکش کنید
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      run: python bot.py
